# =====================================================================
#  SonarQube / SonarCloud project configuration
#  Quality gate + coverage ingestion for the OMNIQA framework.
#  Set the organization/projectKey to your Sonar values.
# =====================================================================
sonar.projectKey=omniqa-playwright-framework
sonar.organization=your-sonar-org
sonar.projectName=OMNIQA Playwright Framework
sonar.projectVersion=1.0.0

# ---- Sources & tests ----
sonar.sources=src
sonar.tests=tests,step-definitions
sonar.sourceEncoding=UTF-8

# ---- Language / analysis ----
# Coverage is produced by `npm run coverage` (c8) → coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# ---- Exclusions: generated artifacts, configs, barrels, type-only files ----
sonar.exclusions=node_modules/**,dist/**,reports/**,coverage/**,test-results/**,playwright-report/**,**/*-snapshots/**,**/index.ts,**/*.types.ts,src/models/**
sonar.coverage.exclusions=tests/**,step-definitions/**,**/*.config.ts,scripts/**,src/custom-reporters/**
